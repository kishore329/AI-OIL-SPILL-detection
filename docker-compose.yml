version: "3.9"

# ─────────────────────────────────────────────
# AI Oil Spill Intelligence — Docker Compose
# Module 1: Database only
# Run: docker-compose up -d db
# ─────────────────────────────────────────────

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: oilspill_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oilspill_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-oilspill_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oilspill_user} -d ${POSTGRES_DB:-oilspill_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: oilspill_pgdata
